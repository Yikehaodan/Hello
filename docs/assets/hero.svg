<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title">
<title id="title">Hello：按下 Fn，把想法说出来。适用于 macOS 的听写、翻译与语音问答工具。</title>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="1440" height="560" rx="32" fill="#112e28" stroke="none"/>
<circle cx="1300" cy="40" r="300" fill="#b8efcc" opacity=".035"/>
<rect x="64" y="54" width="214" height="36" rx="18" fill="#23483c" stroke="none"/>
<text x="84" y="78" font-size="16" fill="#c7edce" font-weight="500">macOS · Apple Silicon</text>
<text x="60" y="197" font-size="108" fill="#f2f8ee" font-weight="650">Hello</text>
<text x="66" y="267" font-size="38" fill="#d1f1d3" font-weight="600">按下 Fn，把想法说出来。</text>
<text x="67" y="319" font-size="26" fill="#acbeb5" font-weight="400">写消息、换种语言、问个问题。</text>
<text x="67" y="359" font-size="26" fill="#acbeb5" font-weight="400">从你正在使用的输入框开始。</text>
<rect x="66" y="440" width="112" height="48" rx="24" fill="#23473c" stroke="none"/>
<text x="91" y="472" font-size="22" fill="#d4efda" font-weight="500">听写</text>
<rect x="190" y="440" width="112" height="48" rx="24" fill="#23473c" stroke="none"/>
<text x="215" y="472" font-size="22" fill="#d4efda" font-weight="500">翻译</text>
<rect x="314" y="440" width="180" height="48" rx="24" fill="#23473c" stroke="none"/>
<text x="339" y="472" font-size="22" fill="#d4efda" font-weight="500">上下文听写</text>
<rect x="506" y="440" width="132" height="48" rx="24" fill="#23473c" stroke="none"/>
<text x="531" y="472" font-size="22" fill="#d4efda" font-weight="500">问一问</text>
<rect x="756" y="62" width="620" height="430" rx="28" fill="#f4f7ef" stroke="none"/>
<text x="790" y="108" font-size="22" fill="#506e60" font-weight="500">一次口述，一段文字</text>
<rect x="790" y="136" width="552" height="96" rx="18" fill="#e7ece2" stroke="none"/>
<text x="816" y="173" font-size="18" fill="#64756a" font-weight="400">你说</text>
<text x="816" y="210" font-size="25" fill="#23473c" font-weight="400">明天下午三点，我们讨论新版设计。</text>
<rect x="790" y="258" width="552" height="112" rx="18" fill="#d9efda" stroke="none"/>
<text x="816" y="294" font-size="18" fill="#536e5a" font-weight="400">输入框</text>
<text x="816" y="335" font-size="25" fill="#23473c" font-weight="400">明天下午 3 点，我们讨论新版设计。</text>
<path d="M1305 311v29" stroke="#466c54" stroke-width="2"/>
<rect x="790" y="400" width="58" height="48" rx="12" fill="#fff" stroke="#d5dfd2"/>
<text x="807" y="432" font-size="24" fill="#244e40" font-weight="600">Fn</text>
<text x="865" y="431" font-size="20" fill="#5b7263" font-weight="400">开始 / 结束录音</text>
<text x="1234" y="464" font-size="16" fill="#788779" font-weight="400">功能示意</text>
</g>
</svg>
